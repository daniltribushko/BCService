plugins {
    id 'java'
    id 'com.google.protobuf' version '0.9.4'
}

group = 'ru.tdd.bc'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.google.protobuf:protobuf-java:4.35.0'
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:4.35.0"
    }
}